# Workflow Examples gallery metadata, read by extensions/rapids_examples.py.
#
# Each example needs:
#   path         its directory in source/examples
#   description  one sentence of at most 120 characters, shown on its card
#   platform     docs pages it runs on, like cloud/aws/sagemaker, or local for any GPU machine
#   library      the main GPU library first
#   task         one or two, the main one first
#   scale        single-gpu, multi-gpu (one machine) or multi-node
# Optional:
#   title        a shorter card title, when the notebook's heading is long
#   tools        docs pages under tools/ it uses
#   dataset, format, storage
#   topics       other search terms, written as they should appear
#   verified     the release you last ran it on, like "26.10". Sorts it first, never shown
#
# library, task, scale, dataset, format and storage take values from the vocabulary below.
# Platform pages are labelled by their short_title front matter, or their title.

vocabulary:
  library:
    GPU libraries:
      cudf: cuDF
      cuml: cuML
      dask: Dask
      xgboost: XGBoost
      cupy: CuPy
      cuspatial: cuSpatial
    Works with:
      scikit-learn: scikit-learn
      optuna: Optuna
      pandas: pandas
      ray: Ray
      mlflow: MLflow
      prefect: Prefect
      triton: Triton
      kafka: Kafka
      morpheus: Morpheus
      dagster: Dagster
      xarray: Xarray
      zarr: Zarr
  task:
    hpo: HPO
    training: Training
    data-processing: Data processing
    inference: Inference
    mlops: MLOps
    benchmarking: Benchmarking
  scale:
    single-gpu: Single GPU
    multi-gpu: Multi-GPU
    multi-node: Multi-node
  dataset:
    airline: Airline
    bnp-claims: BNP Paribas claims
    breast-cancer: Breast cancer
    covertype: Covertype
    esa-worldcover: ESA WorldCover
    higgs: HIGGS
    m5: M5 forecasting
    nyc-parking: NYC parking violations
    nyc-taxi: NYC Taxi
    1brc: One Billion Row Challenge
    reuters: Reuters
    sentinel-2: Sentinel-2
    tabformer: TabFormer
  format:
    csv: CSV
    parquet: Parquet
  storage:
    s3: Amazon S3
    azure-data-lake: Azure Data Lake
    delta-lake: Delta Lake
    gcs: Google Cloud Storage
  # Other names for values, used by search and to suggest the right value
  aliases:
    databricks-delta-lake: delta-lake
    sklearn: scikit-learn
    dask-ml: dask
    dask-cudf: dask
    dask-distributed: dask
    dask-databricks: dask
    dask-deltatable: dask
    fil: cuml
    randomforest: cuml
  # Examples on these platforms are also listed under Kubernetes
  implies:
    cloud/gcp/gke: platforms/kubernetes
    cloud/aws/eks: platforms/kubernetes
    cloud/azure/aks: platforms/kubernetes
  # Shown on their own rather than under their cloud provider
  standalone: [cloud/nvidia/brev]
  # Platform buttons at the top of the gallery, in order. The rest are under "More"
  buttons:
    [
      cloud/aws/index,
      cloud/gcp/index,
      cloud/azure/index,
      cloud/nvidia/brev,
      platforms/kubernetes,
    ]

